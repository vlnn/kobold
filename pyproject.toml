[project]
name = "kobold"
version = "0.5.0"
description = "Alfred workflow: search and tidy an ebook library by metadata, with covers and an optional local model"
requires-python = ">=3.9"
dependencies = ["hoard"]

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14", "ruff>=0.8"]

[tool.uv]
package = false

[tool.uv.sources]
hoard = { path = "../hoard", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["SIM112"]

[tool.ruff.lint.per-file-ignores]
"tests/test_filenames.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kobold", "tests"]
