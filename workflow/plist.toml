kind = "kobold"
name = "Kobold"
bundleid = "com.anokhin.kobold"
description = "Search and tidy an ebook library: library, vault and nook"
createdby = "Volodymyr Anokhin"

[[configuration]]
variable = "KOBOLD_ROOT"
label = "Device root"
type = "text"
description = "The folder that is, or syncs with, your e-reader, e.g. ~/Books/kobo or /Volumes/Transcend/kobo"

[[configuration]]
variable = "KOBOLD_SOURCES"
label = "Library folders"
type = "text"
description = "Where books arrive, separated by ':', e.g. ~/Calibre Library:~/Downloads"

[[configuration]]
variable = "KOBOLD_GENRES"
label = "Genres"
type = "lines"
description = "One genre per line, as a folder path: fiction/sci-fi, nonfiction/computers. Genre folders already in the vault are added to this list."

[[configuration]]
variable = "KOBOLD_STAMP_ON_DONE"
label = "Stamp the genre on finish"
type = "checkbox"
default = true
description = "When kb done files a book, write its genre into the epub or fb2 so KOReader's genre menu sees it. Undo takes it out again."
