name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --locked --python ${{ matrix.python }} ruff check
      - run: uv run --locked --python ${{ matrix.python }} ruff format --check
      - run: uv run --locked --python ${{ matrix.python }} pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Label a pull request's build
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "KOBOLD_BUILD_LABEL=pr$PR.${HEAD:0:7}" >> "$GITHUB_ENV"
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked --python 3.13 python -m hoard.build --check
      - name: Add the window and check it against the Alfred UI schema
        run: make check-window BUILD_PYTHON=3.13
      - run: mv dist/kobold-window.alfredworkflow dist/Kobold.alfredworkflow
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: Kobold.alfredworkflow
          path: dist/Kobold.alfredworkflow
          if-no-files-found: error
      - name: Name the test build
        if: github.event_name == 'pull_request'
        run: cp dist/Kobold.alfredworkflow "dist/Kobold-$KOBOLD_BUILD_LABEL.alfredworkflow"
      - id: test-build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist/Kobold-${{ env.KOBOLD_BUILD_LABEL }}.alfredworkflow
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Say where the test build is
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.test-build.outputs.artifact-url }}
          CAN_COMMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          marker='<!-- kobold-test-build -->'
          body="$marker
          **Test build:** [Kobold-$KOBOLD_BUILD_LABEL.alfredworkflow]($URL)

          Double-click it to install. It replaces the installed Kobold and keeps its settings; the workflow's version reads \`$KOBOLD_BUILD_LABEL\` after the number. It is rebuilt on every push here and kept for 14 days. To go back, install a [release](https://github.com/$GITHUB_REPOSITORY/releases)."
          body=$(sed 's/^          //' <<<"$body")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          [ "$CAN_COMMENT" = true ] || exit 0
          comments="repos/$GITHUB_REPOSITORY/issues/$PR/comments"
          id=$(gh api "$comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" --silent
          else
            gh api "$comments" -f body="$body" --silent
          fi

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Kobold.alfredworkflow
          path: dist
      - name: Publish the latest build
        if: env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/Kobold.alfredworkflow --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Latest build" --notes "Built from $GITHUB_SHA." --prerelease --latest=false
      - name: Publish a tag pushed by hand
        if: env.TAG != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/Kobold.alfredworkflow --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
      - name: Cut the numbered release when the version is new
        if: env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if found=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1); then
            echo "v$VERSION is already tagged"
          elif grep -q "HTTP 404" <<<"$found"; then
            gh release create "v$VERSION" dist/Kobold.alfredworkflow --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          else
            echo "$found"; exit 1
          fi
