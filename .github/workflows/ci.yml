name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --locked --python ${{ matrix.python }} ruff check
      - run: uv run --locked --python ${{ matrix.python }} ruff format --check
      - run: uv run --locked --python ${{ matrix.python }} pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
      - run: uv run --locked --python 3.13 python -m hoard.build --check
      - name: Add the window and check it against the Alfred UI schema
        run: make check-window BUILD_PYTHON=3.13
      - run: mv dist/kobold-window.alfredworkflow dist/Kobold.alfredworkflow
      - uses: actions/upload-artifact@v4
        with:
          name: Kobold.alfredworkflow
          path: dist/Kobold.alfredworkflow
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kobold.alfredworkflow
          path: dist
      - if: env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG == 'latest' && 'Latest build' || env.TAG }}
          prerelease: ${{ env.TAG == 'latest' }}
          generate_release_notes: ${{ env.TAG != 'latest' }}
          files: dist/Kobold.alfredworkflow
      - name: Cut the numbered release when the version is new
        if: env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if found=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1); then
            echo "v$VERSION is already tagged"
          elif grep -q "HTTP 404" <<<"$found"; then
            gh release create "v$VERSION" dist/Kobold.alfredworkflow --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          else
            echo "$found"; exit 1
          fi
