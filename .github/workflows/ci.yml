name: CI

on:
  push:
    branches: [main, kobold2]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  HOARD_REF: found-tags

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: kobold
      - uses: actions/checkout@v4
        with:
          repository: vlnn/hoard
          ref: ${{ env.HOARD_REF }}
          path: hoard
      - uses: astral-sh/setup-uv@v5
      - working-directory: kobold
        run: uv run --python ${{ matrix.python }} ruff check
      - working-directory: kobold
        run: uv run --python ${{ matrix.python }} ruff format --check
      - working-directory: kobold
        run: uv run --python ${{ matrix.python }} pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kobold
      - uses: actions/checkout@v4
        with:
          repository: vlnn/hoard
          ref: ${{ env.HOARD_REF }}
          path: hoard
      - uses: astral-sh/setup-uv@v5
      - working-directory: kobold
        run: uv run --python 3.13 python -m hoard.build --check && mv dist/kobold.alfredworkflow dist/Kobold.alfredworkflow
      - uses: actions/upload-artifact@v4
        with:
          name: Kobold.alfredworkflow
          path: kobold/dist/Kobold.alfredworkflow
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref != 'refs/heads/kobold2'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kobold.alfredworkflow
          path: dist
      - if: env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG == 'latest' && 'Latest build' || env.TAG }}
          prerelease: ${{ env.TAG == 'latest' }}
          generate_release_notes: ${{ env.TAG != 'latest' }}
          files: dist/Kobold.alfredworkflow
